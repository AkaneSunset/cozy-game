<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Annika's Garden</title>
  <meta name="description" content="A cozy princess garden game.">
  <meta name="theme-color" content="#fde2ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Garden">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="princess-chip" id="princessChip" aria-label="Princess settings">
        <span class="avatar" id="avatarSmall"></span>
        <span class="chip-text">
          <span class="name" id="princessName">Annika</span>
          <span class="level">Level <b id="levelNum">1</b></span>
        </span>
      </button>
      <div class="xpbar" aria-hidden="true"><div class="xpfill" id="xpFill"></div></div>
      <div class="coins" id="coinBox"><span class="coin-icon">🪙</span><b id="coinNum">0</b></div>
    </header>

    <main id="views">
      <!-- Garden -->
      <section class="view active" id="view-garden">
        <div class="scene">
          <div class="cloud c1"></div>
          <div class="cloud c2"></div>
          <div class="castle" id="castle"></div>
          <div class="scene-princess" id="scenePrincess"></div>
          <div class="bubble" id="bubble"></div>
        </div>
        <div class="garden-wrap">
          <div class="garden" id="garden"></div>
        </div>
        <div class="seedbar-wrap">
          <div class="seedbar-title">Tap a seed, then tap empty plots to plant</div>
          <div class="seedbar" id="seedbar"></div>
        </div>
      </section>

      <!-- Basket -->
      <section class="view" id="view-basket">
        <h2 class="view-title">🧺 Royal Basket</h2>
        <p class="view-sub">Sell your harvest at the market stall, or save it for orders.</p>
        <div class="basket" id="basket"></div>
      </section>

      <!-- Orders -->
      <section class="view" id="view-orders">
        <h2 class="view-title">📜 Kingdom Orders</h2>
        <p class="view-sub">Friends around the kingdom need your crops. Orders pay extra!</p>
        <div class="orders" id="orders"></div>
      </section>
    </main>

    <nav class="tabs">
      <button class="tab active" data-view="garden"><span>🌷</span>Garden</button>
      <button class="tab" data-view="basket"><span>🧺</span>Basket<i class="badge" id="basketBadge"></i></button>
      <button class="tab" data-view="orders"><span>📜</span>Orders<i class="badge" id="ordersBadge"></i></button>
    </nav>
  </div>

  <!-- Bottom sheet for settings / dialogs -->
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

  <div id="toasts"></div>
  <div id="fx"></div>

  <script src="princess.js"></script>
  <script src="game.js"></script>
</body>
</html>
